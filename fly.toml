# Shared by every demo. No app line: scripts/deploy.sh passes -a dg-devrel-<feature>
# and --build-arg FEATURE=<feature>, so one file deploys any of them.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
